<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>gurgur</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <canvas id="world" tabindex="0" aria-label="Gurgur game world"></canvas>
    </main>
    <form id="speech-chat" hidden>
      <label for="speech-text">Say</label>
      <input
        id="speech-text"
        name="speech"
        type="text"
        maxlength="120"
        autocomplete="off"
        spellcheck="true"
        aria-describedby="speech-status"
      />
    </form>
    <output id="speech-status" aria-live="polite" hidden></output>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
